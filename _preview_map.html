<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podgląd Dark Mode OSM - Bielsko-Biała</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 24px;
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 860px;
            width: 100%;
        }
        h2 { margin-bottom: 6px; font-size: 22px; }
        p { color: #94a3b8; font-size: 14px; margin-top: 0; margin-bottom: 18px; }
        
        #map {
            width: 100%;
            height: 500px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            background-color: #0b0f19;
        }

        /* 1. Odcień Dark Blue (odpowiednik CARTO Dark) */
        #map.filter-dark-blue .leaflet-tile {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) !important;
        }

        /* 2. Odcień Dark Gray (Monochromatyczny grafit) */
        #map.filter-dark-gray .leaflet-tile {
            filter: brightness(0.6) invert(1) contrast(2.5) grayscale(1) !important;
        }

        /* 3. Odcień Midnight (Mocny kontrast, głęboka czerń) */
        #map.filter-midnight .leaflet-tile {
            filter: brightness(0.45) invert(1) contrast(4) hue-rotate(190deg) saturate(0.2) !important;
        }

        /* Stylizacja dymku Leaflet, aby pasował do ciemnego motywu */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #1e293b !important;
            color: #f8fafc !important;
            border: 1px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .leaflet-popup-content b {
            color: #38bdf8;
        }

        .controls {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 18px;
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.15s ease-in-out;
        }
        button:hover { 
            background: #334155; 
            color: #fff;
        }
        button.active {
            background: #2563eb;
            border-color: #3b82f6;
            color: #fff;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Podgląd stylizacji kafelków OpenStreetMap</h2>
        <p>Klikaj w przyciski poniżej, aby na żywo przełączać filtry CSS nakładane na kafelki OSM:</p>
        
        <div id="map" class="filter-dark-blue"></div>

        <div class="controls">
            <button class="active" onclick="setFilter('filter-dark-blue', this)">1. Ciemnoniebieski (CARTO Dark)</button>
            <button onclick="setFilter('filter-dark-gray', this)">2. Grafitowy / Monochrom</button>
            <button onclick="setFilter('filter-midnight', this)">3. Midnight (Mocny kontrast)</button>
            <button onclick="setFilter('', this)">4. Oryginalny OSM (Jasny)</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const coords = [49.8214, 19.0445];
        
        const map = L.map('map').setView(coords, 16);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" style="color:#64748b">OpenStreetMap</a>',
            maxZoom: 19
        }).addTo(map);

        const marker = L.marker(coords).addTo(map);
        marker.bindPopup('<b>Teatr Polski</b><br>ul. 1 Maja 1, Bielsko-Biała').openPopup();

        function setFilter(className, btn) {
            const mapEl = document.getElementById('map');
            
            // Usunięcie poprzednich klas filtrów
            mapEl.classList.remove('filter-dark-blue', 'filter-dark-gray', 'filter-midnight');
            
            // Dodanie nowej klasy jeśli wybrano styl ciemny
            if (className) {
                mapEl.classList.add(className);
            }
            
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
