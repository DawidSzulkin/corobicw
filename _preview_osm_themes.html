<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Stylów Dark Mode dla OpenStreetMap</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 24px;
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        h2 { margin: 0 0 6px 0; font-size: 22px; }
        p { color: #94a3b8; font-size: 14px; margin: 0 0 16px 0; }
        
        #map {
            width: 100%;
            height: 520px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            background-color: #0b0f19;
        }

        /* ==========================================================================
           PRESETY CSS ZE SPOŁECZNOŚCI GITHUB DLA LEAFLET / OPENSTREETMAP
           ========================================================================== */

        /* 1. Charcoal Clean (Minimalistyczny, nowoczesny szary grafit) */
        #map.theme-charcoal .leaflet-tile {
            filter: grayscale(100%) invert(92%) contrast(85%) brightness(90%) !important;
        }

        /* 2. Deep Midnight Navy (Najwierniejszy odpowiednik CARTO Dark) */
        #map.theme-midnight .leaflet-tile {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) !important;
        }

        /* 3. AMOLED True Black (Maksymalna czerń, wysoki kontrast ulic) */
        #map.theme-oled .leaflet-tile {
            filter: invert(100%) grayscale(100%) contrast(160%) brightness(55%) !important;
        }

        /* 4. Warm Slate (Ciepły ciemny motyw, redukcja niebieskiego światła) */
        #map.theme-warm .leaflet-tile {
            filter: invert(100%) hue-rotate(160deg) saturate(0.4) brightness(0.75) contrast(1.2) !important;
        }

        /* 5. Matrix Emerald (Ciemnozielony odcień kartograficzny) */
        #map.theme-matrix .leaflet-tile {
            filter: invert(100%) hue-rotate(90deg) saturate(0.5) brightness(0.7) contrast(1.4) !important;
        }

        /* 6. Cyberpunk Neon (Fioletowo-niebieski styl nocny) */
        #map.theme-cyberpunk .leaflet-tile {
            filter: invert(100%) hue-rotate(240deg) saturate(1.8) brightness(0.7) contrast(1.3) !important;
        }

        /* Stylizacja dymków i kontrolek Leaflet */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #1e293b !important;
            color: #f8fafc !important;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
        }
        .leaflet-popup-content b { color: #38bdf8; }
        .leaflet-control-zoom a {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }
        .leaflet-control-zoom a:hover {
            background-color: #334155 !important;
        }

        .controls {
            margin-top: 18px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }
        button {
            padding: 12px 14px;
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            text-align: left;
            transition: all 0.15s ease-in-out;
        }
        button:hover {
            background: #334155;
            color: #fff;
            border-color: #475569;
        }
        button.active {
            background: #2563eb;
            border-color: #3b82f6;
            color: #fff;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.4);
        }
        .code-box {
            margin-top: 20px;
            padding: 14px;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            color: #38bdf8;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Przeglądarka Stylów Dark Mode dla OpenStreetMap</h2>
        <p>Wybierz jeden z presetów Open Source, aby ocenić czytelność ulic i etykiet:</p>
        
        <div id="map" class="theme-midnight"></div>

        <div class="controls">
            <button class="active" onclick="setTheme('theme-midnight', 'filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);', this)">
                🔵 1. Midnight Navy (CARTO Look)
            </button>
            <button onclick="setTheme('theme-charcoal', 'filter: grayscale(100%) invert(92%) contrast(85%) brightness(90%);', this)">
                ⚪ 2. Charcoal Clean (Szary Minimal)
            </button>
            <button onclick="setTheme('theme-oled', 'filter: invert(100%) grayscale(100%) contrast(160%) brightness(55%);', this)">
                ⚫ 3. AMOLED OLED (Głęboka Czerń)
            </button>
            <button onclick="setTheme('theme-warm', 'filter: invert(100%) hue-rotate(160deg) saturate(0.4) brightness(0.75) contrast(1.2);', this)">
                🟠 4. Warm Slate (Ciepły Grafit)
            </button>
            <button onclick="setTheme('theme-matrix', 'filter: invert(100%) hue-rotate(90deg) saturate(0.5) brightness(0.7) contrast(1.4);', this)">
                🟢 5. Matrix Emerald (Zielonkawo-Nocny)
            </button>
            <button onclick="setTheme('theme-cyberpunk', 'filter: invert(100%) hue-rotate(240deg) saturate(1.8) brightness(0.7) contrast(1.3);', this)">
                🟣 6. Cyberpunk Neon (Fiolet Nocny)
            </button>
        </div>

        <div class="code-box" id="css-preview">
            CSS: filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const coords = [49.8214, 19.0445];
        const map = L.map('map').setView(coords, 16);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" style="color:#64748b">OpenStreetMap</a>',
            maxZoom: 19
        }).addTo(map);

        const marker = L.marker(coords).addTo(map);
        marker.bindPopup('<b>Teatr Polski</b><br>ul. 1 Maja 1, Bielsko-Biała').openPopup();

        const allThemes = ['theme-midnight', 'theme-charcoal', 'theme-oled', 'theme-warm', 'theme-matrix', 'theme-cyberpunk'];

        function setTheme(themeClass, cssRule, btn) {
            const mapEl = document.getElementById('map');
            allThemes.forEach(t => mapEl.classList.remove(t));
            mapEl.classList.add(themeClass);

            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.getElementById('css-preview').innerText = 'CSS: ' + cssRule;
        }
    </script>
</body>
</html>
