<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <style>
    :root {
      --bg: #18181b;
      --grid: #27272a;
      --line: #3f3f46;
      --accent: #34d399;
      --accent-muted: rgba(52, 211, 153, 0.15);
      --text: #a1a1aa;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f1f5f9;
        --grid: #e2e8f0;
        --line: #cbd5e1;
        --accent: #059669;
        --accent-muted: rgba(5, 150, 105, 0.15);
        --text: #64748b;
      }
    }
  </style>
  <rect width="100%" height="100%" fill="var(--bg)"/>
  <g transform="translate(150, 80)">
    <!-- Ramka kadru zewnętrznego -->
    <path d="M-70,-45 L-70,-55 L-55,-55 M55,-55 L70,-55 L70,-45 M70,45 L70,55 L55,55 M-55,55 L-70,55 L-70,45" fill="none" stroke="var(--line)" stroke-width="1.8"/>
    
    <!-- Średnie kwadraty bazowe -->
    <g stroke="var(--line)" stroke-width="2" fill="none">
      <rect x="-40" y="-40" width="34" height="34" rx="3"/>
      <rect x="6" y="-40" width="34" height="34" rx="3"/>
      <rect x="-40" y="6" width="34" height="34" rx="3"/>
      <rect x="6" y="6" width="34" height="34" rx="3"/>
    </g>
    
    <!-- Wewnętrzny celownik optyczny z wymiarami -->
    <g stroke="var(--accent)" stroke-width="1.5" fill="none">
      <rect x="-18" y="-18" width="14" height="14" rx="1.5"/>
      <rect x="4" y="-18" width="14" height="14" rx="1.5"/>
      <rect x="-18" y="4" width="14" height="14" rx="1.5"/>
      <rect x="4" y="4" width="14" height="14" rx="1.5" fill="var(--accent-muted)"/>
    </g>
    <!-- Oznaczenie techniczne -->
    <text x="0" y="68" fill="var(--text)" font-size="7.5" font-family="monospace" font-weight="700" text-anchor="middle" letter-spacing="1">NULL_MEDIA_BOUNDS</text>
  </g>
</svg>