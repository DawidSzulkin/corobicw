<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Wydarzeń Miejskich</title>
  <style>
    :root { --primary: #0056b3; --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text: #0f172a; --muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 40px 16px; }
    .hub-container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 48px; }
    h1 { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
    p.lead { color: var(--muted); font-size: 16px; }
    .city-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .city-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-decoration: none; color: inherit; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.15s, border-color 0.15s; }
    .city-card:hover { transform: translateY(-3px); border-color: var(--primary); }
    .city-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .city-count { font-size: 13px; color: var(--primary); font-weight: 600; margin-bottom: 16px; }
    .city-status { font-size: 12px; color: var(--muted); background: #f1f5f9; padding: 4px 8px; border-radius: 6px; width: fit-content; }
  </style>
</head>
<body>
  <div class="hub-container">
    <header>
      <h1>Co Robić w Mieście</h1>
      <p class="lead">Wybierz miasto, aby przejść do bazy wydarzeń.</p>
    </header>
    <div class="city-grid">
      
        <a href="kedzierzyn_kozle/index.html" class="city-card">
          <div>
            <div class="city-name">Kędzierzyn-Koźle</div>
            <div class="city-count">Zobacz wydarzenia &rarr;</div>
          </div>
          <span class="city-status">Wydanie aktywne</span>
        </a>
      
    </div>
  </div>
</body>
</html>
