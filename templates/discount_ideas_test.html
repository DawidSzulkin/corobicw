<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koncepcje Zniżek - CoRobićW</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #09090b; --card-bg: #121215; --text: #f4f4f5; --text-muted: #a1a1aa; 
      --border: #27272a; --border-strong: #ffffff; --btn-primary-bg: #ffffff; --btn-primary-text: #000000;
      --accent: #38bdf8; --discount-bg: rgba(56, 189, 248, 0.1);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 40px; display: flex; gap: 40px; flex-wrap: wrap;
    }
    .sidebar-mockup {
      background: var(--card-bg); border: 1px solid var(--border); padding: 24px; border-radius: 6px; width: 320px;
    }
    .sidebar-mockup h3 {
      font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; margin-top: 0;
    }
    .info-row { display: flex; margin-bottom: 16px; font-size: 0.95rem; align-items: flex-start; }
    .info-label { width: 35%; font-weight: 700; color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; padding-top: 4px; }
    .info-val { width: 65%; font-weight: 700; font-size: 1.1rem; }
    
    .btn-ticket { display: block; width: 100%; text-align: center; background: var(--btn-primary-bg); color: var(--btn-primary-text); padding: 14px 0; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-top: 24px; text-decoration: none; border: 1px solid var(--btn-primary-bg); }

    /* WARIANT A: Mikro-Tagi */
    .variant-a .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .variant-a .tag { background: var(--discount-bg); color: var(--accent); border: 1px solid rgba(56,189,248,0.3); font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }

    /* WARIANT B: E-commerce Subtext */
    .variant-b .subtext { display: block; font-size: 0.75rem; color: var(--text-muted); font-weight: 500; margin-top: 4px; line-height: 1.3; }
    .variant-b .subtext strong { color: var(--text); }

    /* WARIANT C: Badge + Tooltip */
    .variant-c .price-wrapper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .variant-c .badge-tooltip { position: relative; background: transparent; border: 1px solid var(--accent); color: var(--accent); font-size: 0.7rem; padding: 2px 6px; font-weight: 800; cursor: help; border-radius: 4px; }
    .variant-c .badge-tooltip::after { content: attr(data-tooltip); position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%); background: var(--border-strong); color: var(--bg); padding: 6px 10px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; border-radius: 4px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 10; }
    .variant-c .badge-tooltip:hover::after { opacity: 1; }

  </style>
</head>
<body>

  <!-- WARIANT A -->
  <div class="sidebar-mockup variant-a">
    <h3>Wariant A: Tagi</h3>
    <div class="info-row"><div class="info-label">Start</div><div class="info-val">19:00</div></div>
    <div class="info-row">
      <div class="info-label">Cena</div>
      <div class="info-val">
        Od 190 zł
        <div class="tags">
          <span class="tag">Bielska Karta Rodzina+</span>
          <span class="tag">Senior</span>
        </div>
      </div>
    </div>
    <a href="#" class="btn-ticket">Kup Bilet</a>
  </div>

  <!-- WARIANT B -->
  <div class="sidebar-mockup variant-b">
    <h3>Wariant B: Subtext</h3>
    <div class="info-row"><div class="info-label">Start</div><div class="info-val">19:00</div></div>
    <div class="info-row">
      <div class="info-label">Cena</div>
      <div class="info-val">
        Od 190 zł
        <span class="subtext">Honorujemy <strong>Bielską Kartę Rodzina+</strong> oraz <strong>Karty Seniora</strong>.</span>
      </div>
    </div>
    <a href="#" class="btn-ticket">Kup Bilet</a>
  </div>

  <!-- WARIANT C -->
  <div class="sidebar-mockup variant-c">
    <h3>Wariant C: Tooltip</h3>
    <div class="info-row"><div class="info-label">Start</div><div class="info-val">19:00</div></div>
    <div class="info-row">
      <div class="info-label">Cena</div>
      <div class="info-val price-wrapper">
        Od 190 zł
        <span class="badge-tooltip" data-tooltip="Zniżki: Bielska Karta Rodzina+, Senior">% Zniżki</span>
      </div>
    </div>
    <a href="#" class="btn-ticket">Kup Bilet</a>
  </div>

</body>
</html>
