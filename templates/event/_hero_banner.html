<div class="ambient-banner" oncontextmenu="return false;">
  <div class="ambient-shield" title="CoRobićW - {{ event.title }}"></div>
  <div class="ambient-bg" style="background-image: url('{{ event.image_url or '/assets/placeholder.svg' }}');"></div>
  <img src="{{ event.image_url or '/assets/placeholder.svg' }}" alt="Plakat: {{ event.title }}" class="ambient-fg" onerror="this.onerror=null; this.src='/assets/placeholder.svg';" fetchpriority="high" draggable="false">
</div>

<div class="event-body-header">
  <div>{% for b in event.analysis.badges %}<span class="badge">{{ b }}</span>{% endfor %}</div>
  <h1>{{ event.title }}</h1>

  <div class="event-actions-bar">
    <a href="https://www.google.com/calendar/render?action=TEMPLATE&text={{ event.title | urlencode }}&details={{ (event.analysis.full_description or '') | truncate(150) | urlencode }}" target="_blank" rel="noopener" class="action-btn">📅 Kalendarz</a>
    <a href="https://wa.me/?text={{ event.title | urlencode }}%20-%20https://corobicw.pl/{{ city_tag }}/wydarzenia/{{ event.slug }}/" target="_blank" rel="noopener" class="action-btn">💬 Wyślij znajomym</a>
  </div>
</div>
