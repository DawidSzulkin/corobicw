{% if event.nearby_gastro %}
<div class="card">
  <h2>W okolicy (Gastro)</h2>
  <div class="gastro-list">
    {% for g in event.nearby_gastro %}
    <div class="gastro-item">
      <div class="gastro-name">{{ g.name }}</div>
      <div class="gastro-meta">{{ g.distance_m }}m stąd (~{{ g.walk_time_min }} min) &bull; {{ g.category }}</div>
    </div>
    {% endfor %}
  </div>
</div>
{% endif %}
