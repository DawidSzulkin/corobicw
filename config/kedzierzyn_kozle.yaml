    \ wynikające bezpośrednio z tekstu.\n\nSchemat JSON:\n{\n  \"category\": \"Kategoria\
    \ wydarzenia (np. Koncert, Teatr, Sport, Kino, Dla Dzieci, Spotkanie)\",\n  \"\
